<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    
    <!-- Browser tab icon / thumbnail linked from your Google Drive image -->
    <link rel="icon" type="image/png" href="https://lh3.googleusercontent.com/d/1L-Jv5pLOJz2dAsW4uTAaUzU0eM1ToErw">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
        }

        /* Full-screen iframe with no header and no page exits */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>

    <iframe 
        src="https://script.google.com/macros/s/AKfycbw9szNIuNHMRZR1iugjuqG4LTUBAPB7yVK9C9vATgxSUXWELarItPA9dtF4Ts9aW0-l2A/exec" 
        allow="geolocation; microphone; camera; midi; encrypted-media;"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
        loading="lazy">
    </iframe>

</body>
</html>
