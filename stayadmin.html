<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>
    <!-- Favicon / Thumbnail Icon in browser tab -->
    <link rel="icon" type="image/png" href="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_Apps_Script_2020_Logo.svg">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
        }

        /* Top Bar with Thumbnail Icon and Link */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 10px 20px;
            background-color: #ffffff;
            border-bottom: 1px solid #e0e0e0;
            height: 50px;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-left img {
            width: 24px;
            height: 24px;
        }

        .header-left span {
            font-weight: bold;
            color: #333;
        }

        .header-right a {
            text-decoration: none;
            color: #1a73e8;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .header-right a:hover {
            text-decoration: underline;
        }

        /* Container for the iframe */
        .iframe-container {
            width: 100%;
            height: calc(100vh - 50px);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

    <!-- Header / Branding Bar -->
    <div class="header">
        <div class="header-left">
            <img src="https://upload.wikimedia.org/wikipedia/commons/2/2f/Google_Apps_Script_2020_Logo.svg" alt="Apps Script Logo">
            <span>Admin Dashboard</span>
        </div>
        <div class="header-right">
            <a href="https://script.google.com/macros/s/AKfycbw9szNIuNHMRZR1iugjuqG4LTUBAPB7yVK9C9vATgxSUXWELarItPA9dtF4Ts9aW0-l2A/exec?page=admin" target="_blank" rel="noopener noreferrer">
                Open Original Link ↗
            </a>
        </div>
    </div>

    <!-- Embedded Web App Frame -->
    <div class="iframe-container">
        <iframe 
            src="https://script.google.com/macros/s/AKfycbw9szNIuNHMRZR1iugjuqG4LTUBAPB7yVK9C9vATgxSUXWELarItPA9dtF4Ts9aW0-l2A/exec?page=admin" 
            allow="geolocation; microphone; camera; midi; encrypted-media;"
            sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts"
            loading="lazy">
        </iframe>
    </div>

</body>
</html>
