<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- Primary SEO Meta Tags -->
    <title>PrintPOS | Print & Signage Operations Manager</title>
    <meta name="description" content="Streamline your print shop operations, job queues, material inventory, and custom signage production with PrintPOS.">
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1">
    <meta name="author" content="PrintPOS Systems">

    <!-- Open Graph / Social & Search Engine Rich Snippets -->
    <meta property="og:type" content="website">
    <meta property="og:title" content="PrintPOS | Print & Signage Operations Manager">
    <meta property="og:description" content="Manage print queues, vector processing, and inventory seamlessly.">
    <meta property="og:image" content="pos.png">

    <!-- Favicon Suite -->
    <link rel="icon" type="image/png" href="pos.png">
    <link rel="shortcut icon" type="image/x-icon" href="pos.png">
    <link rel="apple-touch-icon" href="pos.png">

    <style>
        :root {
            --bg-color: #0b0d10;
            --accent-color: #00f0ff;
            --accent-magenta: #ff007f;
            --accent-glow: rgba(0, 240, 255, 0.15);
            --text-main: #ffffff;
            --text-muted: #8e9a9f;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
            touch-action: none;
        }

        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: -150px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-wrapper {
            position: relative;
            margin-bottom: 24px;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            animation: premiumEntrance 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
        }
        
        .logo-wrapper img {
            width: 95px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.4));
        }

        .entrance-text {
            color: var(--text-main);
            font-size: 26px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.6s 0.15s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
            text-align: center;
        }
        
        .subtitle-text {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            margin: 0 0 40px 0;
            letter-spacing: 0.5px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.6s 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
            text-align: center;
            text-transform: uppercase;
        }

        .progress-container {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.3s 0.35s forwards;
        }
        
        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #00f0ff, var(--accent-magenta), #ffcc00);
            transform: translateX(-100%);
            animation: loaderProgress 1.8s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 12px var(--accent-color);
        }

        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transform: scale(1.01);
            transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }

        iframe.loaded {
            opacity: 1;
            transform: scale(1);
        }

        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* --- iOS Assistive Touch Floating Button Styling --- */
        #assistive-touch {
            position: fixed;
            bottom: 30px;
            right: 30px;
            width: 54px;
            height: 54px;
            background: rgba(15, 20, 25, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.18);
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), inset 0 0 12px rgba(0, 240, 255, 0.2);
            z-index: 10000;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            user-select: none;
            transition: transform 0.15s ease, background 0.2s ease, opacity 0.3s ease;
            opacity: 0.85;
        }

        #assistive-touch:hover, #assistive-touch.active-drag {
            opacity: 1;
            background: rgba(20, 30, 40, 0.85);
            transform: scale(1.08);
            border-color: var(--accent-color);
            box-shadow: 0 10px 40px rgba(0, 240, 255, 0.3), inset 0 0 15px rgba(0, 240, 255, 0.4);
        }

        .touch-inner-ring {
            width: 32px;
            height: 32px;
            border: 2px solid rgba(0, 240, 255, 0.7);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 0 8px var(--accent-color);
            pointer-events: none;
        }

        .touch-core-dot {
            width: 8px;
            height: 8px;
            background-color: #ffffff;
            border-radius: 50%;
            box-shadow: 0 0 6px #ffffff;
            pointer-events: none;
        }

        @keyframes premiumEntrance {
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        @keyframes fadeInUp {
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes loaderProgress {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(-20%); }
            100% { transform: translateX(100%); }
        }
        @keyframes floatGlow {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(30px, 20px, 0) scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- Semantic Hidden Text for Search Engine Crawlers -->
    <div style="display:none;" aria-hidden="true">
        <h1>PrintPOS Print & Signage Operations Manager</h1>
        <p>Manage print queues, custom signage jobs, vector file processing, inventory management, material tracking, and client invoicing.</p>
    </div>

    <div class="bg-glow"></div>

    <!-- iOS Style Movable Floating Assistive Touch Button -->
    <div id="assistive-touch" title="Tap for Admin Access" aria-label="Admin Dashboard shortcut">
        <div class="touch-inner-ring">
            <div class="touch-core-dot"></div>
        </div>
    </div>

    <div id="loader">
        <div class="logo-wrapper">
            <img src="pos.png" alt="PrintPOS Logo">
        </div>
        
        <h1 class="entrance-text">PrintPOS | Production & Job Engine</h1>
        <p class="subtitle-text">Syncing Print Queue & Material Inventory</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <iframe 
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbwbXLOYlXnGmnYHjULNPEUpO0RTtjeMmeoipG6T9P7PiJIsCs1uTcSw0mpmzOWt0SID/exec" 
      allow="camera; microphone; geolocation; clipboard-write"
      sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        let appInitialized = false;

        function initializeApp() {
            if (appInitialized) return;
            appInitialized = true;
            
            iframe.classList.add('loaded');
            loader.classList.add('fade-out');
        }

        iframe.addEventListener('load', initializeApp);
        setTimeout(initializeApp, 2500);

        // --- Movable & Admin Verification Prompt Logic ---
        const floatBtn = document.getElementById('assistive-touch');
        const adminUrl = "https://script.google.com/macros/s/AKfycbwbXLOYlXnGmnYHjULNPEUpO0RTtjeMmeoipG6T9P7PiJIsCs1uTcSw0mpmzOWt0SID/exec?page=admin";

        let isDragging = false;
        let hasMoved = false;
        let startX, startY, initialX, initialY;

        function dragStart(e) {
            isDragging = true;
            hasMoved = false;
            floatBtn.classList.add('active-drag');

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            startX = clientX;
            startY = clientY;

            const rect = floatBtn.getBoundingClientRect();
            initialX = rect.left;
            initialY = rect.top;

            floatBtn.style.left = initialX + 'px';
            floatBtn.style.top = initialY + 'px';
            floatBtn.style.bottom = 'auto';
            floatBtn.style.right = 'auto';
        }

        function dragMove(e) {
            if (!isDragging) return;

            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;

            const dx = clientX - startX;
            const dy = clientY - startY;

            if (Math.abs(dx) > 4 || Math.abs(dy) > 4) {
                hasMoved = true;
            }

            let newX = initialX + dx;
            let newY = initialY + dy;

            const maxX = window.innerWidth - floatBtn.offsetWidth;
            const maxY = window.innerHeight - floatBtn.offsetHeight;

            newX = Math.max(10, Math.min(newX, maxX - 10));
            newY = Math.max(10, Math.min(newY, maxY - 10));

            floatBtn.style.left = newX + 'px';
            floatBtn.style.top = newY + 'px';
        }

        function dragEnd() {
            if (!isDragging) return;
            isDragging = false;
            floatBtn.classList.remove('active-drag');
        }

        // Mouse & Touch Drag Listeners
        floatBtn.addEventListener('mousedown', dragStart);
        window.addEventListener('mousemove', dragMove);
        window.addEventListener('mouseup', dragEnd);

        floatBtn.addEventListener('touchstart', dragStart, { passive: true });
        window.addEventListener('touchmove', dragMove, { passive: true });
        window.addEventListener('touchend', dragEnd);

        // Click / Tap Handler with "Are you Admin?" Prompt Check
        let clickTimer = null;

        floatBtn.addEventListener('click', (e) => {
            if (hasMoved) return; // Prevent triggering if user was dragging the button

            if (!clickTimer) {
                clickTimer = setTimeout(() => {
                    clickTimer = null;
                    triggerAdminCheck();
                }, 250);
            } else {
                clearTimeout(clickTimer);
                clickTimer = null;
                triggerAdminCheck();
            }
        });

        function triggerAdminCheck() {
            // Asks "Are you Admin?"
            const isAdmin = confirm("Are you Admin?");
            
            if (isAdmin) {
                // If OK / Yes -> Proceed to Admin Dashboard
                window.location.href = adminUrl;
            } else {
                // If Cancel / No -> Stay right here / Go back / Do nothing
                return;
            }
        }
    </script>
</body>
</html>
