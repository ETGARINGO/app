<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Precise Title Update -->
    <title>POS | Records Manager</title>
    
    <!-- Complete Link Icon (Favicon) Suite for Cross-Browser Compatibility -->
    <link rel="icon" type="image/png" href="pos.png">
    <link rel="shortcut icon" type="image/x-icon" href="pos.png">
    <link rel="apple-touch-icon" href="pos.png">

    <style>
        :root {
            --bg-color: #0b0f19;
            --accent-color: #58a6ff;
            --accent-glow: rgba(88, 166, 255, 0.18);
            --text-main: #ffffff;
            --text-muted: #8b949e;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        /* Ambient Tech Glow Background */
        .bg-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, var(--accent-glow) 0%, rgba(0,0,0,0) 70%);
            top: -150px;
            left: -150px;
            z-index: 1;
            pointer-events: none;
            transform: translate3d(0, 0, 0);
            animation: floatGlow 12s ease-in-out infinite alternate;
        }

        /* Screen Overlay / Entrance Loader */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.6s;
            padding: 20px;
            box-sizing: border-box;
        }

        /* Premium Logo Showcase */
        .logo-wrapper {
            position: relative;
            margin-bottom: 24px;
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            animation: premiumEntrance 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
        }
        
        .logo-wrapper img {
            width: 90px;
            height: auto;
            display: block;
            filter: drop-shadow(0 0 25px rgba(88, 166, 255, 0.4));
        }

        /* Typography & Headings */
        .entrance-text {
            color: var(--text-main);
            font-size: 24px;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin: 0 0 8px 0;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
            text-align: center;
        }
        
        .subtitle-text {
            color: var(--text-muted);
            font-size: 14px;
            font-weight: 400;
            margin: 0 0 40px 0;
            letter-spacing: 0.3px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 2;
            text-align: center;
        }

        /* Cinematic Custom Loading Bar */
        .progress-container {
            width: 220px;
            height: 4px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 10px;
            overflow: hidden;
            position: relative;
            opacity: 0;
            animation: fadeIn 0.4s 0.5s forwards;
        }
        
        .progress-bar {
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, #388bfd, var(--accent-color), #79c0ff);
            transform: translateX(-100%);
            animation: loaderProgress 2.2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            box-shadow: 0 0 12px var(--accent-color);
        }

        /* Main Embedded Application Window */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transform: scale(1.015);
            filter: blur(4px);
            transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), 
                        transform 0.8s cubic-bezier(0.16, 1, 0.3, 1),
                        filter 0.8s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Smooth Reveal State */
        iframe.loaded {
            opacity: 1;
            transform: scale(1);
            filter: blur(0px);
        }

        /* Master Hide Selector */
        .fade-out {
            opacity: 0 !important;
            visibility: hidden !important;
        }

        /* Keyframe Animations */
        @keyframes premiumEntrance {
            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }
        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        @keyframes fadeIn {
            to { opacity: 1; }
        }
        @keyframes loaderProgress {
            0% { transform: translateX(-100%); }
            50% { transform: translateX(-20%); }
            100% { transform: translateX(100%); }
        }
        @keyframes floatGlow {
            0% { transform: translate3d(0, 0, 0) scale(1); }
            100% { transform: translate3d(30px, 20px, 0) scale(1.15); }
        }
    </style>
</head>
<body>

    <!-- Premium Background Accent Glow -->
    <div class="bg-glow"></div>

    <!-- Entrance Loader Overlay -->
    <div id="loader">
        <div class="logo-wrapper">
            <img src="pos.png" alt="System Logo">
        </div>
        
        <h1 class="entrance-text">POS | Firebase Records Manager</h1>
        <p class="subtitle-text">Secure Cloud Database Environment</p>
        
        <div class="progress-container">
            <div class="progress-bar"></div>
        </div>
    </div>

    <!-- Application Embedded Frame -->
    <!-- Fixed sandbox parameter: replaced non-standard 'allow-layouts' with standard 'allow-downloads' -->
    <iframe 
      id="app-frame"
      src="https://system.web247.online/" 
      allow="camera; microphone; geolocation; clipboard-write"
      sandbox="allow-downloads allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-same-origin allow-scripts">
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');
        let appInitialized = false;

        // Centralized setup initialization function
        function initializeApp() {
            if (appInitialized) return;
            appInitialized = true;
            
            iframe.classList.add('loaded');
            loader.classList.add('fade-out');
        }

        // Strategy A: Monitor Native System Initialization Completion
        iframe.addEventListener('load', initializeApp);

        // Strategy B: Cross-Origin Fail-safe Timeout
        // If strict cross-domain headers/CSP limit programmatic monitoring, fade loader after 3.5s anyway
        setTimeout(initializeApp, 3500);
    </script>
</body>
</html>
