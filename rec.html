<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personnel Records Management System</title>
    
    <!-- Link Icon (Favicon) -->
    <link rel="icon" type="image/png" href="pos.png">

    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #0d1117; /* Dark background */
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        /* Loading Screen overlay */
        #loader {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.6s ease, visibility 0.6s;
        }

        /* Animated Logo Container */
        .logo-container {
            margin-bottom: 20px;
            opacity: 0;
            transform: scale(0.8);
            animation: logoEntrance 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        .logo-container img {
            width: 80px; /* Adjust size as needed */
            height: auto;
            display: block;
        }

        /* Animated Title Entrance */
        .entrance-text {
            color: #ffffff;
            font-size: 24px;
            font-weight: 600;
            letter-spacing: 1px;
            margin-bottom: 25px;
            opacity: 0;
            transform: translateY(15px);
            animation: fadeInUp 0.8s 0.2s forwards ease-out;
        }

        /* Modern Spinner */
        .spinner {
            width: 32px;
            height: 32px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-top: 3px solid #58a6ff; /* Clean Blue Accent */
            border-radius: 50%;
            opacity: 0;
            animation: spin 1s linear infinite, fadeIn 0.5s 0.5s forwards;
        }

        /* Keyframe Animations */
        @keyframes logoEntrance {
            to {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Main Content Frame Animation */
        iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            opacity: 0;
            transform: scale(0.98);
            transition: opacity 0.8s 0.2s ease, transform 0.8s 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        /* Triggered when the iframe loads */
        iframe.loaded {
            opacity: 1;
            transform: scale(1);
        }

        /* Class to hide the loader */
        .fade-out {
            opacity: 0;
            visibility: hidden;
        }
    </style>
</head>
<body>

    <!-- Animated Entrance Loader -->
    <div id="loader">
        <!-- System Logo -->
        <div class="logo-container">
            <img src="pos.png" alt="System Logo">
        </div>
        <!-- System Title -->
        <div class="entrance-text">Personnel Records Management System</div>
        <!-- Loading Spinner -->
        <div class="spinner"></div>
    </div>

    <!-- Embedded System Frame -->
    <iframe 
      id="app-frame"
      src="https://script.google.com/macros/s/AKfycbzcCV_G0eQLOgFbYIJSKkCp58KiroKzyXMkCr3g0KugLzxEwy9E7TpGbRqN0McOSuI/exec" 
      allow="geolocation; microphone; camera; clipboard-write">
    </iframe>

    <script>
        const iframe = document.getElementById('app-frame');
        const loader = document.getElementById('loader');

        // Detect when the iframe content is fully loaded
        iframe.addEventListener('load', () => {
            // Smoothly reveal the system layout
            iframe.classList.add('loaded');
            // Hide the animated entrance loader
            loader.classList.add('fade-out');
        });
    </script>

</body>
</html>
